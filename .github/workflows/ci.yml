# Runs the two suites on every push and PR. A linter is still outstanding (#3).
#
# bedtools is the oracle, so the golden tests need it installed here too. Note that
# the runner's bedtools must match the one you develop against -- a version
# difference shows up as golden-test failures that are nothing to do with your code.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:      # lets you re-run CI by hand from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bedtools (the oracle)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bedtools
          echo "runner bedtools: $(bedtools --version)"
          echo "developed against: bedtools v2.31.1"

      - name: Unit tests (need no bedtools)
        run: python3 -m unittest discover -s tests -v

      - name: Golden tests (diff stdout against real bedtools)
        run: ./tests/run_golden.sh
